[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragvault-backend"
version = "0.6.0"
description = "Local-first document chat with checked source citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pymupdf>=1.26,<2.0",
    "pgvector>=0.5.1,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: isolated PostgreSQL/pgvector integration (RAGVAULT_TEST_POSTGRES=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
